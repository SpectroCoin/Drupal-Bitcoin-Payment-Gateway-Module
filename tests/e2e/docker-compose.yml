# Tier 1 smoke test: a real Drupal + Drupal Commerce, into which the packaged
# module is installed exactly as a site builder would install it.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: drupal
    healthcheck:
      # Asserts the DATABASE exists, not merely that the server answers:
      # mariadb reports healthy while its init scripts are still running.
      test: ["CMD-SHELL", "mariadb -uroot -proot -e 'USE drupal' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  drupal:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/core/install.php || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
